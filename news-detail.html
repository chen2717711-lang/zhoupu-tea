</div>

<script>

    // ==========================
    // Supabase
    // ==========================

    const SUPABASE_URL =
        'https://tbakknfdijlwzggqrrzc.supabase.co';


    // 請放你原本使用的 Supabase Publishable Key
    const SUPABASE_KEY =
        'sb_publishable_C4MU15NKj3NsB24466kMYQ_G9OQT93-';


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================
    // 取得網址上的新聞 ID
    // ==========================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const newsId =
        params.get('id');


    // ==========================
    // HTML 安全處理
    // ==========================

    function escapeHtml(text) {

        return String(text)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            );

    }


    // ==========================
    // 日期格式
    // ==========================

    function formatDate(date) {

        if (!date) {

            return '最新消息';

        }

        return String(date)
            .split('T')[0]
            .replace(
                /-/g,
                '.'
            );

    }


    // ==========================
    // 讀取新聞
    // ==========================

    async function loadNewsDetail() {

        const newsDetail =
            document.getElementById(
                'newsDetail'
            );


        if (!newsId) {

            newsDetail.innerHTML = `

                <h1>找不到這則消息</h1>

                <p>
                    請從最新消息列表進入。
                </p>

            `;

            return;

        }


        const { data, error } =
            await supabaseClient

                .from('site_content')

                .select(
                    'id, content'
                )

                .eq(
                    'id',
                    newsId
                )

                .eq(
                    'key',
                    'news'
                )

                .single();


        if (error || !data) {

            console.error(
                '讀取新聞失敗：',
                error
            );


            newsDetail.innerHTML = `

                <h1>找不到這則消息</h1>

                <p>
                    這則消息可能已經被刪除。
                </p>

            `;

            return;

        }


        try {

            const news =
                JSON.parse(
                    data.content
                );


            newsDetail.innerHTML = `

                <div class="news-date">

                    ${formatDate(news.date)}

                </div>


                <h1>

                    ${escapeHtml(
                        news.title || ''
                    )}

                </h1>


                ${
                   Array.isArray(news.images) && news.images.length > 0
    ? news.images.map(image => `
        
        <img
            class="news-image"
            src="${image}"
            alt="">
            
      `).join('')
    : news.image
        ? `
            
            <img
                class="news-image"
                src="${news.image}"
                alt="">
                
          `
        : ''
                }


                <div class="news-content">

                    ${escapeHtml(
                        news.content || ''
                    )}

                </div>

            `;


        } catch (error) {

            console.error(
                '新聞資料格式錯誤：',
                error
            );


            newsDetail.innerHTML = `

                <h1>消息資料錯誤</h1>

            `;

        }

    }


    // ==========================
    // 啟動
    // ==========================

    loadNewsDetail();

</script>

</body>
