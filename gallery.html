<!DOCTYPE html>

<html lang="zh-Hant">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>作品展示管理｜拙璞山茶</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

    body {
        font-family:
            Arial,
            "Microsoft JhengHei",
            sans-serif;

        background: #f5f3ef;

        margin: 0;

        padding: 30px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .back {
        display: inline-block;
        margin-bottom: 20px;
        color: #555;
        text-decoration: none;
    }

    h1 {
        color: #333;
    }

    .card {
        background: white;
        padding: 25px;
        margin-bottom: 25px;
        border-radius: 12px;
        box-shadow:
            0 3px 12px rgba(0,0,0,0.08);
    }

    input[type="file"] {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fafafa;
    }

    button {
        margin-top: 20px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #5b7052;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    .delete-button {
        background: #b44;
        margin-top: 10px;
    }

    #preview {
        margin-top: 20px;
    }

    #preview img {
        width: 100%;
        max-width: 500px;
        max-height: 350px;
        object-fit: cover;
        border-radius: 8px;
    }

    .photo-list {
        display: grid;
        grid-template-columns:
            repeat(3, 1fr);

        gap: 20px;
        margin-top: 20px;
    }

    .photo-item {
        background: #fafafa;
        padding: 10px;
        border-radius: 10px;
    }

    .photo-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
    }

    .message {
        margin-top: 15px;
        font-weight: bold;
    }

    @media (max-width: 768px) {

        .photo-list {
            grid-template-columns: 1fr;
        }

        body {
            padding: 15px;
        }

    }

</style>
```

</head>

<body>

<div class="container">

```
<a
    href="dashboard.html"
    class="back">
    ← 回管理首頁
</a>

<h1>🖼️ 作品展示</h1>

<div class="card">

    <h2>📷 上傳作品照片</h2>

    <input
        type="file"
        id="galleryImage"
        accept="image/*">

    <div id="preview"></div>

    <button
        onclick="uploadGalleryImage()">
        💾 儲存照片
    </button>

    <div
        class="message"
        id="message">
    </div>

</div>


<div class="card">

    <h2>🖼️ 已上傳照片</h2>

    <div
        class="photo-list"
        id="photoList">

        正在載入...

    </div>

</div>
```

</div>

<script>


    // ==========================
    // Supabase
    // ==========================

    const SUPABASE_URL =
        'https://tbakknfdijlwzggqrrzc.supabase.co';


    // 請放你原本使用的 Supabase Publishable Key
    const SUPABASE_KEY =
       'sb_publishable_C4MU15NKj3NsB24466kMYQ_G9OQT93-';


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================
    // 圖片預覽
    // ==========================

    document
        .getElementById('galleryImage')
        .addEventListener(
            'change',
            function(event) {

                const file =
                    event.target.files[0];

                const preview =
                    document.getElementById(
                        'preview'
                    );

                preview.innerHTML = '';

                if (!file) return;

                const imageUrl =
                    URL.createObjectURL(file);

                preview.innerHTML = `

                    <img
                        src="${imageUrl}"
                        alt="圖片預覽">

                `;

            }
        );


    // ==========================
    // 上傳照片
    // ==========================

    async function uploadGalleryImage() {

        const file =
            document
                .getElementById(
                    'galleryImage'
                )
                .files[0];


        if (!file) {

            alert('請先選擇一張照片');

            return;

        }


      const fileExt =
    file.name.split('.').pop();

const fileName =
    'gallery-' +
    Date.now() +
    '.' +
    fileExt;

        // 上傳到 Storage

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from('site-images')
                .upload(
                    fileName,
                    file
                );


        if (uploadError) {

            console.error(
                '照片上傳失敗：',
                uploadError
            );

            alert(
                '照片上傳失敗：' +
                uploadError.message
            );

            return;

        }


        // 取得公開網址

        const { data } =
            supabaseClient
                .storage
                .from('site-images')
                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data.publicUrl;


        // 儲存圖片網址到 site_content

        const { error } =
            await supabaseClient
                .from('site_content')
                .insert({

                    key: 'gallery',

                    content:
                        JSON.stringify({
                            image: imageUrl
                        })

                });


        if (error) {

            console.error(
                '照片資料儲存失敗：',
                error
            );

            alert(
                '照片儲存失敗：' +
                error.message
            );

            return;

        }


        document
            .getElementById(
                'message'
            )
            .textContent =
                '✅ 照片已成功上傳！';


        // 清除選擇

        document
            .getElementById(
                'galleryImage'
            )
            .value = '';


        document
            .getElementById(
                'preview'
            )
            .innerHTML = '';


        // 重新讀取照片

        loadGallery();

    }


    // ==========================
    // 讀取照片
    // ==========================

    async function loadGallery() {

        const { data, error } =
            await supabaseClient
                .from('site_content')
                .select(
                    'id, content'
                )
                .eq(
                    'key',
                    'gallery'
                )
                .order(
                    'id',
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                '讀取照片失敗：',
                error
            );

            document
                .getElementById(
                    'photoList'
                )
                .textContent =
                    '讀取失敗：' +
                    error.message;

            return;

        }


        const photoList =
            document
                .getElementById(
                    'photoList'
                );


        photoList.innerHTML = '';


        if (!data || data.length === 0) {

            photoList.innerHTML =
                '<p>目前沒有作品照片。</p>';

            return;

        }


        data.forEach(
            function(row) {

                try {

                    const gallery =
                        JSON.parse(
                            row.content
                        );


                    const item =
                        document.createElement(
                            'div'
                        );

                    item.className =
                        'photo-item';


                    item.innerHTML = `

                        <img
                            src="${gallery.image}"
                            alt="作品照片">

                        <button
                            class="delete-button"
                            onclick="deleteGallery(${row.id})">
                            🗑️ 刪除
                        </button>

                    `;


                    photoList.appendChild(
                        item
                    );


                } catch (error) {

                    console.error(
                        '照片資料格式錯誤：',
                        error
                    );

                }

            }
        );

    }


    // ==========================
    // 刪除照片
    // ==========================

    async function deleteGallery(id) {

        if (
            !confirm(
                '確定要刪除這張照片嗎？'
            )
        ) {

            return;

        }


        const { error } =
            await supabaseClient
                .from('site_content')
                .delete()
                .eq(
                    'id',
                    id
                );


        if (error) {

            alert(
                '刪除失敗：' +
                error.message
            );

            return;

        }


        loadGallery();

    }


    // ==========================
    // 啟動
    // ==========================

    loadGallery();


</script>

</body>

</html>
