name: 自動更新 Sitemap

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: 下載網站程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 建立 Sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from xml.sax.saxutils import escape

          supabase_url = os.environ["SUPABASE_URL"]
          supabase_key = os.environ["SUPABASE_KEY"]

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}"
          }

          base_url = "https://chen2717711-lang.github.io/zhoupu-tea/"

          urls = {
              base_url,
              base_url + "news-list.html",
              base_url + "gallery-list.html",
              base_url + "tea.html"
          }

          def get_content(key):
              url = (
                  supabase_url
                  + "/rest/v1/site_content"
                  + "?select=content"
                  + "&key=eq."
                  + key
              )

              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              if not data:
                  return None

              content = data[0].get("content")

              if isinstance(content, str):
                  try:
                      return json.loads(content)
                  except Exception:
                      return content

              return content

          def find_ids(data):
              ids = set()

              if isinstance(data, dict):
                  if "id" in data:
                      value = data["id"]

                      if isinstance(value, (int, str)):
                          ids.add(str(value))

                  for value in data.values():
                      ids.update(find_ids(value))

              elif isinstance(data, list):
                  for item in data:
                      ids.update(find_ids(item))

              return ids

          # 讀取新聞
          try:
              news_data = get_content("news")
              news_ids = find_ids(news_data)

              for news_id in news_ids:
                  urls.add(
                      base_url
                      + "news-detail.html?id="
                      + news_id
                  )

              print("找到新聞詳細頁：", len(news_ids), "個")

          except Exception as e:
              print("讀取新聞失敗：", e)

          # 讀取茶品
          try:
              tea_data = get_content("tea_product")
              tea_ids = find_ids(tea_data)

              for tea_id in tea_ids:
                  urls.add(
                      base_url
                      + "tea-detail.html?id="
                      + tea_id
                  )

              print("找到茶品詳細頁：", len(tea_ids), "個")

          except Exception as e:
              print("讀取茶品失敗：", e)

          # 建立 Sitemap
          sitemap = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in sorted(urls):
              sitemap.append("  <url>")
              sitemap.append(
                  "    <loc>"
                  + escape(url)
                  + "</loc>"
              )
              sitemap.append("  </url>")

          sitemap.append("</urlset>")

          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(sitemap))

          print(
              "Sitemap 更新完成，共",
              len(urls),
              "個網址"
          )

          PY

      - name: 發布 Sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "自動更新 sitemap"
          git push
