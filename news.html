<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>最新消息管理｜拙璞山茶</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5f3ee;
            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;
            color: #333;
        }


        .container {
            max-width: 900px;
            margin: auto;
        }


        h1 {
            margin-bottom: 30px;
        }


        .card {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }


        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }


        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }


        textarea {
            min-height: 180px;
            resize: vertical;
        }


        input[type="file"] {
            padding: 8px;
        }


        button {
            margin-top: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #6b7d52;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }


        button:hover {
            opacity: 0.9;
        }


        .delete-button {
            background: #a44;
        }


        .edit-button {
            background: #8a7654;
        }


        .back-button {
            background: #777;
            margin-bottom: 20px;
        }


        #preview {
            margin-top: 15px;
            max-width: 300px;
            max-height: 200px;
            display: none;
            border-radius: 8px;
        }


        #message {
            margin-top: 20px;
            font-weight: bold;
        }


        .news-item {
            border-top: 1px solid #ddd;
            padding: 25px 0;
        }


        .news-item:first-child {
            border-top: none;
        }


        .news-date {
            color: #9a8060;
            font-size: 14px;
            margin-bottom: 8px;
        }


        .news-item h3 {
            color: #46533d;
            margin: 5px 0 15px;
        }


        .news-item p {
            line-height: 1.8;
            white-space: pre-wrap;
        }


        .news-item img {
            width: 100%;
            max-width: 500px;
            max-height: 300px;
            object-fit: cover;
            display: block;
            margin: 15px 0;
            border-radius: 8px;
        }


        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

    </style>

</head>


<body>


<div class="container">


    <button
        class="back-button"
        onclick="location.href='dashboard.html'">
        ← 回到後台
    </button>


    <h1>📰 最新消息管理</h1>


    <!-- 新增 / 編輯 -->

    <div class="card">


        <h2 id="formTitle">
            新增最新消息
        </h2>


        <!-- 日期 -->

        <label>
            消息日期
        </label>

        <input
            type="date"
            id="newsDate">


        <!-- 標題 -->

        <label>
            消息標題
        </label>

        <input
            type="text"
            id="newsTitle"
            placeholder="例如：2026 春茶上市">


        <!-- 內容 -->

        <label>
            消息內容
        </label>

        <textarea
            id="newsContent"
            placeholder="請輸入最新消息內容"></textarea>


        <!-- 圖片 -->

        <label>
            消息圖片
        </label>

        <input
    type="file"
    id="newsImage"
    accept="image/*"
    multiple>


        <div
    id="preview"
    style="
        display: none;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
    ">
</div>


        <div class="button-group">

            <button
                onclick="saveNews()">
                💾 儲存最新消息
            </button>


            <button
                id="cancelButton"
                onclick="cancelEdit()"
                style="display:none; background:#777;">
                取消編輯
            </button>

        </div>


        <div id="message"></div>


    </div>


    <!-- 已發布消息 -->

    <div class="card">


        <h2>
            📋 已發布的最新消息
        </h2>


        <div id="newsList">

            正在載入...

        </div>


    </div>


</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
    // ==========================
// 載入 HEIC 轉換工具
// ==========================

function loadHeic2Any() {

    return new Promise(
        function(resolve, reject) {

            if (
                typeof heic2any !==
                'undefined'
            ) {

                resolve(
                    heic2any
                );

                return;

            }

            const script =
                document.createElement(
                    'script'
                );

            script.src =
                'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';

            script.onload =
                function() {

                    if (
                        typeof heic2any !==
                        'undefined'
                    ) {

                        resolve(
                            heic2any
                        );

                    } else {

                        reject(
                            new Error(
                                'HEIC 工具載入失敗'
                            )
                        );

                    }

                };

            script.onerror =
                function() {

                    reject(
                        new Error(
                            '無法載入 HEIC 轉換工具'
                        )
                    );

                };

            document.head.appendChild(
                script
            );

        }
    );

}


    const SUPABASE_URL =
        'https://tbakknfdijlwzggqrrzc.supabase.co';


    const SUPABASE_KEY =
        'sb_publishable_C4MU15NKj3NsB24466kMYQ_G9OQT93-';


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // 目前正在編輯的消息 ID

    let editingId = null;
    let editingImages = [];


    // ==========================
// 最新消息照片預覽
// HEIC / HEIF 自動轉 JPEG
// ==========================

document
.getElementById('newsImage')
.addEventListener(
    'change',
    async function () {

        const files = this.files;

        const preview =
            document.getElementById(
                'preview'
            );

        preview.innerHTML = '';

        if (
            !files ||
            files.length === 0
        ) {

            preview.style.display =
                'none';

            return;

        }

        preview.style.display =
            'flex';

        preview.style.flexWrap =
            'wrap';

        preview.style.gap =
            '10px';


        // 一張一張處理
        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];

            const box =
                document.createElement(
                    'div'
                );

            box.style.textAlign =
                'center';

            box.style.width =
                '140px';

            preview.appendChild(
                box
            );


            const image =
                document.createElement(
                    'img'
                );

            image.style.width =
                '140px';

            image.style.height =
                '100px';

            image.style.objectFit =
                'cover';

            image.style.borderRadius =
                '8px';

            image.style.background =
                '#f5f5f5';

            image.alt =
                '圖片預覽';


            box.appendChild(
                image
            );


            // ==========================
            // 判斷是不是 HEIC
            // ==========================

            const fileName =
                file.name.toLowerCase();

            const isHEIC =
                fileName.endsWith('.heic') ||
                fileName.endsWith('.heif') ||
                file.type === 'image/heic' ||
                file.type === 'image/heif';


            // ==========================
            // HEIC → JPEG
            // ==========================

            if (isHEIC) {

                const status =
                    document.createElement(
                        'div'
                    );

                status.textContent =
                    '⏳ HEIC 轉換中...';

                status.style.fontSize =
                    '13px';

                status.style.color =
                    '#666';

                status.style.marginTop =
                    '4px';

                box.appendChild(
                    status
                );


                try {

                    const heic2any =
                        await loadHeic2Any();

                    const convertedBlob =
                        await heic2any({

                            blob:
                                file,

                            toType:
                                'image/jpeg',

                            quality:
                                0.9

                        });


                    const jpegBlob =
                        Array.isArray(
                            convertedBlob
                        )
                            ? convertedBlob[0]
                            : convertedBlob;


                    const imageUrl =
                        URL.createObjectURL(
                            jpegBlob
                        );


                    image.src =
                        imageUrl;

                    status.textContent =
                        '✅ HEIC 已轉 JPEG';


                } catch (error) {

                    console.error(
                        'HEIC 轉換失敗：',
                        error
                    );

                    image.style.display =
                        'none';

                    status.textContent =
                        '❌ HEIC 無法轉換';

                    status.style.color =
                        '#b44';

                }


            } else {

                // ==========================
                // 一般圖片
                // ==========================

                const imageUrl =
                    URL.createObjectURL(
                        file
                    );

                image.src =
                    imageUrl;

            }

        }

    }
);


    // 儲存消息

    async function saveNews() {


        const date =
            document.getElementById(
                'newsDate'
            ).value;


        const title =
            document.getElementById(
                'newsTitle'
            ).value.trim();


        const content =
            document.getElementById(
                'newsContent'
            ).value.trim();


        const imageFiles =
    document.getElementById(
        'newsImage'
    ).files;


        const message =
            document.getElementById(
                'message'
            );


        if (!date) {

            message.textContent =
                '⚠️ 請選擇消息日期';

            return;

        }


        if (!title) {

            message.textContent =
                '⚠️ 請輸入消息標題';

            return;

        }


        if (!content) {

            message.textContent =
                '⚠️ 請輸入消息內容';

            return;

        }


        message.textContent =
            '⏳ 正在儲存...';


let imageUrls = [];

// ==========================
// 上傳多張圖片
// HEIC / HEIF 自動轉成 JPEG
// ==========================

if (
    imageFiles &&
    imageFiles.length > 0
) {

    for (
        let i = 0;
        i < imageFiles.length;
        i++
    ) {

        const originalFile =
            imageFiles[i];

        let uploadFile =
            originalFile;

        let fileName =
            originalFile.name;


        // ==========================
        // 判斷 HEIC / HEIF
        // ==========================

        const lowerName =
            originalFile.name.toLowerCase();

        const isHEIC =
            lowerName.endsWith('.heic') ||
            lowerName.endsWith('.heif') ||
            originalFile.type === 'image/heic' ||
            originalFile.type === 'image/heif';


        // ==========================
        // HEIC → JPEG
        // ==========================

        if (isHEIC) {

            message.textContent =
                '⏳ 正在轉換第 ' +
                (i + 1) +
                ' / ' +
                imageFiles.length +
                ' 張 HEIC...';


            try {

                const heic2any =
                    await loadHeic2Any();


                const convertedBlob =
                    await heic2any({

                        blob:
                            originalFile,

                        toType:
                            'image/jpeg',

                        quality:
                            0.9

                    });


                const jpegBlob =
                    Array.isArray(
                        convertedBlob
                    )
                        ? convertedBlob[0]
                        : convertedBlob;


                // 變成真正的 JPEG 檔案
                uploadFile =
                    new File(
                        [
                            jpegBlob
                        ],
                        originalFile.name.replace(
                            /\.(heic|heif)$/i,
                            '.jpg'
                        ),
                        {
                            type:
                                'image/jpeg'
                        }
                    );


                fileName =
                    uploadFile.name;


            } catch (error) {

                console.error(
                    'HEIC 轉換失敗：',
                    error
                );


                message.textContent =
                    '❌ 第 ' +
                    (i + 1) +
                    ' 張 HEIC 轉換失敗';

                return;

            }

        }


        // ==========================
        // 建立檔案副檔名
        // ==========================

        const fileExt =
            fileName
                .split('.')
                .pop()
                .toLowerCase();


        const fileNameForStorage =
            'news-' +
            Date.now() +
            '-' +
            i +
            '.' +
            fileExt;


        const filePath =
            'news/' +
            fileNameForStorage;


        // ==========================
        // 上傳
        // ==========================

        message.textContent =
            '⏳ 正在上傳第 ' +
            (i + 1) +
            ' / ' +
            imageFiles.length +
            ' 張圖片...';


        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from('site-images')
                .upload(
                    filePath,
                    uploadFile,
                    {
                        contentType:
                            uploadFile.type,

                        upsert:
                            false
                    }
                );


        if (uploadError) {

            console.error(
                '圖片上傳失敗：',
                uploadError
            );


            message.textContent =
                '❌ 第 ' +
                (i + 1) +
                ' 張圖片上傳失敗';

            return;

        }


        // ==========================
        // 取得圖片網址
        // ==========================

        const imageUrl =
            SUPABASE_URL +
            '/storage/v1/object/public/site-images/' +
            filePath;


        imageUrls.push(
            imageUrl
        );

    }

}
// 編輯時：保留沒有刪掉的舊圖片
// 再加上這次新上傳的圖片

if (editingId) {

    imageUrls = [
        ...editingImages,
        ...imageUrls
    ];

}

        const newsData = {

            title: title,

            content: content,

           images: imageUrls,

            date: date

        };


        // 編輯現有消息

        if (editingId) {


            const { error } =
                await supabaseClient
                    .from('site_content')
                    .update({

                        content:
                            JSON.stringify(
                                newsData
                            )

                    })
                    .eq('id', editingId);


            if (error) {

                console.error(
                    '更新消息失敗：',
                    error
                );

                message.textContent =
                    '❌ 更新消息失敗';

                return;

            }


            message.textContent =
                '✅ 最新消息已更新！';


        } else {


            // 新增消息

            const { error } =
                await supabaseClient
                    .from('site_content')
                    .insert({

                        key: 'news',

                        content:
                            JSON.stringify(
                                newsData
                            )

                    });


            if (error) {

                console.error(
                    '新增消息失敗：',
                    error
                );

                message.textContent =
                    '❌ 最新消息儲存失敗';

                return;

            }


            message.textContent =
                '✅ 最新消息已成功新增！';

        }


        clearForm();

        await loadNews();

    }


    // 讀取所有消息

    async function loadNews() {


        const { data, error } =
            await supabaseClient
                .from('site_content')
                .select('id, content')
                .eq('key', 'news')
                .order('id', {
                    ascending: false
                });


        if (error) {

            console.error(
                '讀取最新消息失敗：',
                error
            );

            document.getElementById(
                'newsList'
            ).textContent =
                '❌ 讀取最新消息失敗';

            return;

        }


        const newsList =
            document.getElementById(
                'newsList'
            );


        newsList.innerHTML = '';


        if (!data || data.length === 0) {

            newsList.innerHTML =
                '<p>目前沒有發布任何消息。</p>';

            return;

        }


        data.forEach(function(row) {


            try {


                const news =
                    JSON.parse(
                        row.content
                    );


                const item =
                    document.createElement(
                        'div'
                    );


                item.className =
                    'news-item';


                item.innerHTML = `

                    <div class="news-date">
                        ${formatDate(news.date)}
                    </div>

                    <h3>
                        ${escapeHtml(news.title || '')}
                    </h3>
${
    Array.isArray(news.images)
        ? news.images.map(function(image) {
            return `
                <img
                    src="${escapeHtml(image)}"
                    alt=""
                    style="
                        width: 140px;
                        height: 100px;
                        object-fit: cover;
                        border-radius: 8px;
                        margin: 5px;
                    ">
            `;
        }).join('')
        : news.image
            ? `
                <img
                    src="${escapeHtml(news.image)}"
                    alt=""
                    style="
                        width: 140px;
                        height: 100px;
                        object-fit: cover;
                        border-radius: 8px;
                        margin: 5px;
                    ">
              `
            : ''
}

                    <p>
                        ${escapeHtml(news.content || '')}
                    </p>

                    <div class="button-group">

                        <button
                            class="edit-button"
                            onclick="editNews(${row.id})">
                            ✏️ 編輯
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteNews(${row.id})">
                            🗑️ 刪除
                        </button>

                    </div>

                `;


                newsList.appendChild(item);


            } catch (error) {


                console.error(
                    '消息資料格式錯誤：',
                    error
                );


            }

        });

    }


    // 編輯消息

    async function editNews(id) {


        const { data, error } =
            await supabaseClient
                .from('site_content')
                .select('content')
                .eq('id', id)
                .single();


        if (error) {

            console.error(
                '讀取消息失敗：',
                error
            );

            return;

        }


        const news =
            JSON.parse(data.content);


        editingId = id;


        document.getElementById(
            'formTitle'
        ).textContent =
            '✏️ 編輯最新消息';


        document.getElementById(
            'newsDate'
        ).value =
            news.date || '';


        document.getElementById(
            'newsTitle'
        ).value =
            news.title || '';


        document.getElementById(
            'newsContent'
        ).value =
            news.content || '';


        const preview =
            document.getElementById(
                'preview'
            );


// 顯示原本的多張圖片

preview.innerHTML = '';


let imageList = [];


if (Array.isArray(news.images)) {

    imageList =
        [...news.images];

}
else if (news.image) {

    imageList = [
        news.image
    ];

}


// 記住目前正在編輯的圖片

editingImages =
    imageList;

    

if (imageList.length > 0) {

    preview.style.display =
        'flex';

    preview.style.flexWrap =
        'wrap';

    preview.style.gap =
        '10px';


    imageList.forEach(
    function (imageUrl, index) {

        const wrapper =
            document.createElement(
                'div'
            );


        wrapper.style.position =
            'relative';

        wrapper.style.width =
            '140px';

        wrapper.style.height =
            '100px';


        const image =
            document.createElement(
                'img'
            );


        image.src =
            imageUrl;


        image.style.width =
            '140px';

        image.style.height =
            '100px';

        image.style.objectFit =
            'cover';

        image.style.borderRadius =
            '8px';


        const deleteButton =
            document.createElement(
                'button'
            );


        deleteButton.textContent =
            '✕';


        deleteButton.type =
            'button';


        deleteButton.style.position =
            'absolute';

        deleteButton.style.top =
            '5px';

        deleteButton.style.right =
            '5px';

        deleteButton.style.width =
            '28px';

        deleteButton.style.height =
            '28px';

        deleteButton.style.padding =
            '0';

        deleteButton.style.borderRadius =
            '50%';

        deleteButton.style.border =
            'none';

        deleteButton.style.background =
            'rgba(0,0,0,0.7)';

        deleteButton.style.color =
            'white';

        deleteButton.style.cursor =
            'pointer';


        deleteButton.onclick =
            function () {

                imageList.splice(
                    index,
                    1
                );


                wrapper.remove();

            };


        wrapper.appendChild(
            image
        );


        wrapper.appendChild(
            deleteButton
        );


        preview.appendChild(
            wrapper
        );

    }
);

}
else {

    preview.style.display =
        'none';

}


        document.getElementById(
            'cancelButton'
        ).style.display =
            'inline-block';


        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    }


    // ==========================
// 刪除消息
// 同時刪除 Storage 裡的照片
// ==========================

async function deleteNews(id) {

    const ok =
        confirm(
            '確定要刪除這則最新消息嗎？'
        );

    if (!ok) return;


    // ==========================
    // 第 1 步：先取得這篇消息
    // ==========================

    const {
        data: newsData,
        error: getError
    } =
        await supabaseClient
            .from('site_content')
            .select('content')
            .eq('id', id)
            .single();


    if (getError) {

        console.error(
            '取得消息失敗：',
            getError
        );

        alert(
            '❌ 無法取得消息資料'
        );

        return;

    }


    // ==========================
    // 第 2 步：讀取圖片網址
    // ==========================

    let newsContent = {};

    try {

        newsContent =
            JSON.parse(
                newsData.content
            );

    } catch (error) {

        console.error(
            '消息資料格式錯誤：',
            error
        );

    }


    let imageUrls = [];


    // 新格式：images
    if (
        Array.isArray(
            newsContent.images
        )
    ) {

        imageUrls =
            newsContent.images;

    }

    // 舊格式：image
    else if (
        newsContent.image
    ) {

        imageUrls = [
            newsContent.image
        ];

    }


    // ==========================
    // 第 3 步：刪除 Storage 照片
    // ==========================

    for (
        let i = 0;
        i < imageUrls.length;
        i++
    ) {

        const imageUrl =
            imageUrls[i];


        try {

            // 找出 Storage 裡面的檔案路徑
            const marker =
                '/storage/v1/object/public/site-images/';


            const markerIndex =
                imageUrl.indexOf(
                    marker
                );


            if (
                markerIndex === -1
            ) {

                console.warn(
                    '找不到 Storage 路徑：',
                    imageUrl
                );

                continue;

            }


            const filePath =
                imageUrl.substring(
                    markerIndex +
                    marker.length
                );


            console.log(
                '準備刪除照片：',
                filePath
            );


            const {
                error: storageError
            } =
                await supabaseClient
                    .storage
                    .from('site-images')
                    .remove([
                        filePath
                    ]);


            if (storageError) {

                console.error(
                    'Storage 照片刪除失敗：',
                    storageError
                );

            } else {

                console.log(
                    '照片已刪除：',
                    filePath
                );

            }

        } catch (error) {

            console.error(
                '處理照片刪除失敗：',
                error
            );

        }

    }


    // ==========================
    // 第 4 步：刪除資料庫消息
    // ==========================

    const { error } =
        await supabaseClient
            .from('site_content')
            .delete()
            .eq('id', id);


    if (error) {

        console.error(
            '刪除消息失敗：',
            error
        );

        alert(
            '❌ 消息刪除失敗'
        );

        return;

    }


    // ==========================
    // 完成
    // ==========================

    alert(
        '✅ 最新消息與照片已刪除'
    );


    loadNews();

}

    // 取消編輯

    function cancelEdit() {

        clearForm();

    }


    // 清空表單

    function clearForm() {


        editingId = null;

        editingImages = [];


        document.getElementById(
            'formTitle'
        ).textContent =
            '新增最新消息';


        document.getElementById(
            'newsDate'
        ).value = '';


        document.getElementById(
            'newsTitle'
        ).value = '';


        document.getElementById(
            'newsContent'
        ).value = '';


        document.getElementById(
            'newsImage'
        ).value = '';


        document.getElementById(
            'preview'
        ).style.display =
            'none';


        document.getElementById(
            'cancelButton'
        ).style.display =
            'none';

    }


    // 日期格式

    function formatDate(date) {

        if (!date) {
            return '最新消息';
        }


        const parts =
            date.split('-');


        if (parts.length === 3) {

            return (
                parts[0] +
                '.' +
                parts[1] +
                '.' +
                parts[2]
            );

        }


        return date;

    }


    // 避免特殊文字影響網頁

    function escapeHtml(text) {

        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    // 載入消息

    loadNews();


</script>
